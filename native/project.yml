# Projet Xcode généré par XcodeGen (https://github.com/yonaskolb/XcodeGen) :
#   brew install xcodegen && cd native && xcodegen && open AidesCognitives.xcodeproj
# Une seule cible MULTIPLATEFORME (iPhone, iPad, Mac natif) : même code SwiftUI, mise en page
# adaptée par classe de taille.
name: AidesCognitives
options:
  bundleIdPrefix: fr.aidescognitives
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # à renseigner (équipe Apple Developer) pour signer
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  AidesCore:
    path: AidesCore
targets:
  AidesCognitives:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: AidesCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Aides cognitives
        CFBundleDevelopmentRegion: fr
        LSApplicationCategoryType: public.app-category.medical
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: "La caméra sert à lire le code QR d'un partage de session."
        NSLocalNetworkUsageDescription: "Le réseau local sert au partage de session « en direct », sans serveur."
        NSBonjourServices: [_aidescog._tcp]
        CFBundleURLTypes:
          - CFBundleURLName: fr.aidescognitives.join
            CFBundleURLSchemes: [aidescog]
        UTExportedTypeDeclarations: []
        CFBundleDocumentTypes:
          - CFBundleTypeName: Sauvegarde Aides cognitives
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json, public.zip-archive]
    entitlements:
      path: App/AidesCognitives.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.device.camera: true
        com.apple.security.print: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.aidescognitives.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
schemes:
  AidesCognitives:
    build:
      targets:
        AidesCognitives: all
    # Les tests du cœur vivent dans le paquet AidesCore (Xcode les montre via le schéma du
    # paquet ; en ligne de commande : `cd AidesCore && swift test`).
