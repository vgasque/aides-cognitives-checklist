name: CI

on:
  push:
    branches: [main]
  pull_request:

# A675 : le jeton de la CI ne fait que LIRE le dépôt (aucun job n'écrit). Sans ce bloc, il hérite du
# réglage par défaut du dépôt — possiblement en écriture sur `main`, d'où part le déploiement.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm run check` EN ENTIER, et non son premier maillon appelé en direct : il porte la
      # syntaxe des scripts inline, le garde-fou couleurs et la fraîcheur des hashs CSP. Aucun des
      # trois ne demande de dépendance, d'où sa place avant l'installation (échec en quelques
      # secondes). Auparavant seul check-syntax.mjs était appelé : check-colors.mjs, présenté
      # comme « auto-exécutoire », ne tournait dans AUCUNE barrière automatique.
      - name: Vérifier syntaxe, couleurs et hashs CSP
        run: npm run check

      # Garde-fou anti-dérive : design/ds/ doit refléter le CSS d'index.html (régénéré par
      # design/build.mjs). Échoue si un changement de CSS a été poussé sans rejouer le build.
      - name: Vérifier que design/ds/ est à jour
        run: node scripts/design-check.mjs --strict

      # `npm ci` et non `npm install` : installe EXACTEMENT le contenu du lock, donc une CI
      # reproductible — `npm install` peut résoudre une autre version d'un jour à l'autre.
      - name: Installer les dépendances de test
        run: npm ci

      - name: Cache des navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # WebKit EN PLUS de Chromium : iOS Safari est la cible principale (PWA installée sur iPhone)
      # et n'était jamais testé — toute la suite tournait sur Blink seul. `npm test` joue les deux
      # moteurs ; WebKit absent produit un avertissement, pas un échec.
      - name: Installer Chromium et WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Lancer la suite de tests (Chromium + WebKit)
        run: npm test

      # L'AUDIT TRANSVERSE n'est plus ici : il tourne dans les jobs `audit` (trois lots en parallèle) et
      # `audit-bilan` ci-dessous, en même temps que ce job au lieu de s'ajouter à sa fin (A566).

  # AUDIT TRANSVERSE — NON BLOQUANT, à dessein. AGENTS.md pose qu'un échec d'audit « demande un arbitrage
  # humain, pas un blocage de merge » : ces harnais MESURENT des invariants de doctrine (contraste sur le fond
  # effectif, cibles tactiles, ordre du quai, compression sous 400 px…) dont la correction relève parfois d'une
  # décision de conception. Ils tournent donc à chaque push, visibles dans le journal, sans bloquer la fusion.
  # RÉPARTI EN TROIS LOTS (A566) : chaque machine joue sa part de la passe COMPLÈTE (`--lot k/3`, partage
  # déterministe sur les poids déclarés de HARNAIS) et écrit un rapport ; `audit-bilan` les rassemble et vérifie
  # que CHAQUE tâche a été jouée exactement une fois — un lot perdu ne fabrique jamais un vert.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false        # un lot rouge n'annule pas les autres : on veut TOUS les rouges d'une passe
      matrix:
        lot: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Installer les dépendances de test
        run: npm ci
      # Clé distincte de celle du job `test` : ce job n'installe que Chromium (l'audit tourne sur AC_ENGINE
      # par défaut), et ne doit pas enregistrer un cache sans WebKit sous la clé que `test` restaure.
      - name: Cache du navigateur Playwright (Chromium)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit — lot ${{ matrix.lot }}/3 (indicatif)
        run: node scripts/audit-run.mjs --lot ${{ matrix.lot }}/3 --rapport audit-lot-${{ matrix.lot }}.json
      # Toujours téléversé, rouge compris : le bilan a besoin des trois. Un lot qui n'a rien écrit (plantage du
      # lanceur) n'envoie rien, et le bilan le déclare ABSENT.
      - name: Téléverser le rapport du lot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-lot-${{ matrix.lot }}
          path: audit-lot-${{ matrix.lot }}.json
          if-no-files-found: ignore
          # Un lot RELANCÉ (« Re-run failed jobs ») doit REMPLACER le rapport de la tentative précédente : sans
          # `overwrite`, le bilan relisait le rapport rouge d'origine et restait rouge alors que le lot venait de
          # passer (constaté sur la PR #89).
          overwrite: true

  audit-bilan:
    needs: audit
    if: always()              # même (surtout) quand un lot a échoué ou manque
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rassembler les rapports des lots
        uses: actions/download-artifact@v4
        with:
          pattern: audit-lot-*
          merge-multiple: true
          path: rapports
      # Le bilan n'utilise que Node : ni `npm ci`, ni navigateur. Il recalcule lui-même la liste attendue des
      # tâches et ne conclut au vert que si l'union des lots la couvre exactement, toute verte.
      - name: Bilan de la passe complète répartie (indicatif)
        run: node scripts/audit-run.mjs --bilan rapports/*.json
