# Application NATIVE (native/) — iPhone, iPad, Mac.
#
# Deux vérifications, séparées à dessein :
#  1. le cœur métier (AidesCore) se TESTE (`swift test`) — il ne dépend que de Foundation ;
#  2. l'application SwiftUI se COMPILE pour iOS (simulateur) et pour macOS. Rien n'est signé :
#     la signature et la distribution restent un geste de l'auteur, dans Xcode.
# Cibles minimales iOS / iPadOS / macOS 26 (Liquid Glass sans `#available`) ; compilé avec le SDK
# le plus récent disponible (Xcode 27 si l'image l'offre, sinon le Xcode par défaut, ≥ 26).
# Le projet Xcode n'est pas versionné : il est GÉNÉRÉ par XcodeGen depuis native/project.yml.
name: Native

on:
  push:
    branches: [native-apple]
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Choisir Xcode (27 si présent)
        run: |
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Version de Xcode
        run: xcodebuild -version && swift --version
      - name: Tests du cœur (AidesCore)
        working-directory: native/AidesCore
        run: swift test 2>&1 | tail -n 60

  app:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        destination: ['generic/platform=iOS Simulator', 'generic/platform=macOS']
    steps:
      - uses: actions/checkout@v4
      - name: Choisir Xcode (27 si présent)
        run: |
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: XcodeGen
        run: brew install xcodegen
      - name: Générer le projet
        working-directory: native
        run: xcodegen generate
      - name: Compiler (${{ matrix.destination }})
        working-directory: native
        run: |
          set -o pipefail
          xcodebuild -project AidesCognitives.xcodeproj -scheme AidesCognitives \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 \
            | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" | head -n 300
      - name: Journal des erreurs
        if: failure()
        working-directory: native
        run: grep -E "error:" build.log | sort -u | head -n 400

  # CAPTURES D'ÉCRAN : l'app tourne dans le simulateur (iPhone puis iPad, clair puis sombre),
  # posée dans un état connu par `-ac-demo <écran>` (cf. App/Sources/Platform/DemoCapture.swift).
  # Les images sortent en artefact « captures » et, sur un push de native-apple, en JPEG réduits sur
# la branche ORPHELINE `native-captures` (réécrite à chaque passage ; elle ne porte que des images).
  shots:
    runs-on: macos-26
    needs: app
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Choisir Xcode (27 si présent)
        run: |
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: XcodeGen
        run: brew install xcodegen && cd native && xcodegen generate
      - name: Simulateurs
        id: sim
        run: |
          pick() { xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']
          best=None
          for rt,devs in d.items():
            if 'iOS' not in rt: continue
            v=tuple(int(x) for x in re.findall(r'(\\d+)', rt.split('iOS')[-1])[:2])
            for x in devs:
              if re.search(sys.argv[1], x['name']) and (best is None or v>best[0]): best=(v,x['udid'],x['name'])
          print(best[1] if best else '')" "$1"; }
          echo "phone=$(pick 'iPhone.*Pro$|iPhone 1[0-9]$')" >> $GITHUB_OUTPUT
          echo "pad=$(pick 'iPad Pro|iPad Air')" >> $GITHUB_OUTPUT
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -n 20
      - name: Compiler pour le simulateur
        working-directory: native
        run: |
          set -o pipefail
          xcodebuild -project AidesCognitives.xcodeproj -scheme AidesCognitives \
            -destination "id=${{ steps.sim.outputs.phone }}" -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | head -n 100
      - name: Photographier
        working-directory: native
        run: |
          APP=$(ls -d dd/Build/Products/Debug-iphonesimulator/*.app | head -n 1)
          BID=fr.aidescognitives.app
          mkdir -p ../shots
          shoot() { # $1 appareil, $2 préfixe, $3 apparence
            D=$1
            xcrun simctl boot "$D" 2>/dev/null || true
            xcrun simctl bootstatus "$D" -b
            xcrun simctl ui "$D" appearance "$3"
            xcrun simctl status_bar "$D" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            xcrun simctl uninstall "$D" $BID 2>/dev/null || true
            xcrun simctl install "$D" "$APP"
            xcrun simctl launch "$D" $BID; sleep 6
            xcrun simctl io "$D" screenshot "../shots/$2-01-bienvenue-$3.png"
            n=2
            for s in home search fiche session sessions me reference edit; do
              xcrun simctl terminate "$D" $BID 2>/dev/null || true; sleep 1
              xcrun simctl launch "$D" $BID -ac-demo $s; sleep 6
              xcrun simctl io "$D" screenshot "../shots/$2-$(printf %02d $n)-$s-$3.png"
              # Diagnostic (premier passage seulement) : pile du processus (un écran blanc = fil
              # principal bloqué ?) et journal de l'app.
              if [ "$2-$3" = "iphone-light" ]; then
                P=$(pgrep -f "AidesCognitives.app/AidesCognitives" | head -n 1)
                if [ -n "$P" ]; then sample "$P" 2 -mayDie -file "../shots/diag-$s-sample.txt" >/dev/null 2>&1 || true
                else echo "processus absent (plantage ?)" > "../shots/diag-$s-sample.txt"; fi
                xcrun simctl spawn "$D" log show --last 20s --style compact \
                  --predicate 'process == "AidesCognitives"' 2>/dev/null | tail -n 80 > "../shots/diag-$s-log.txt" || true
              fi
              n=$((n+1))
            done
          }
          shoot "${{ steps.sim.outputs.phone }}" iphone light
          shoot "${{ steps.sim.outputs.phone }}" iphone dark
          if [ -n "${{ steps.sim.outputs.pad }}" ]; then shoot "${{ steps.sim.outputs.pad }}" ipad light; fi
          ls -la ../shots
          for f in ~/Library/Logs/DiagnosticReports/AidesCognitives*; do [ -f "$f" ] && head -c 60000 "$f" > "../shots/diag-crash-$(basename "$f").txt"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: shots/*
          if-no-files-found: warn
      - name: Publier les captures (branche native-captures)
        if: github.event_name == 'push'
        run: |
          mkdir -p pub
          for f in shots/*.png; do
            sips -s format jpeg -s formatOptions 70 -Z 1400 "$f" --out "pub/$(basename "${f%.png}").jpg" >/dev/null
          done
          cp shots/*.txt pub/ 2>/dev/null || true
          cd pub
          git init -q && git checkout -q -b native-captures
          git add . && git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Captures de ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" native-captures
