     « à plat » mesurerait donc une fiche sans étapes, et le témoin serait vert pour rien. */
  const _mkF=(extra)=>A.migrate({id:'f1',v:4,kind:'procedure',title:'Anaphylaxie',
    items:[{id:'i1',do:'⚠ Adrénaline IM 0,5 mg'},{id:'i2',do:'⚠ Appeler à l’aide'},
           {id:'i3',do:'Poser une voie'}].concat((extra&&extra.items)||[]),
    blocks:[{id:'b1',title:'Adrénaline',kind:'do',items:['i1','i2','i3']}]
      .concat((extra&&extra.blocks)||[])});
  const _mkR=(ck,timers,extra)=>({fiche:_mkF(extra),
    nav:[{id:'b1'}],navSeq:[1],checked:ck||{},timers:timers||{}});
  eq('rien d’ouvert → aucune ligne', A.endSessOpenTxt(_mkR({'1:b1:0':1,'1:b1:1':1},{})).length, 0);
  /* Une seule étape vitale non cochée : le SINGULIER, et le bloc est nommé. */
  {const l=A.endSessOpenTxt(_mkR({'1:b1:0':1},{}));
   eq('une vitale non cochée → une ligne', l.length, 1);
   ok('… au singulier et nommant le bloc', /1 étape vitale non cochée — Adrénaline/.test(l[0].txt), l[0]&&l[0].txt);}
  {const l=A.endSessOpenTxt(_mkR({},{}));
   ok('deux vitales → le pluriel', /2 étapes vitales/.test(l[0].txt), l[0]&&l[0].txt);}
  /* L'étape ORDINAIRE non cochée ne compte pas : la ligne annonce le VITAL, pas l'inachevé. */
  ok('une étape ordinaire non cochée ne compte pas',
     A.endSessOpenTxt(_mkR({'1:b1:0':1,'1:b1:1':1},{})).length===0);
  /* Un minuteur en PAUSE n'est pas « en cours » — il ne réclame rien. */
  {const l=A.endSessOpenTxt(_mkR({'1:b1:0':1,'1:b1:1':1},{t1:{running:false}}));
   eq('minuteur en pause → aucune ligne', l.length, 0);}
  {const l=A.endSessOpenTxt(_mkR({'1:b1:0':1,'1:b1:1':1},{t1:{running:true},t2:{running:true}}));
   ok('deux minuteurs en cours → une ligne au pluriel', l.length===1&&/2 minuteurs en cours/.test(l[0].txt));}
  /* ⚠ UN BLOC JAMAIS VISITÉ N'EST PAS OUBLIÉ, IL EST HORS CHEMIN : le compter ferait paraître
     incomplète toute session qui a pris une branche. */
  {const R=_mkR({'1:b1:0':1,'1:b1:1':1},{},
     {items:[{id:'i4',do:'⚠ Geste vital d’une autre branche'}],
      blocks:[{id:'b2',title:'Jamais vu',kind:'do',items:['i4']}]});
   eq('bloc non visité → ignoré', A.endSessOpenTxt(R).length, 0);}

  /* ══ P4 (v5.7) — l'échu en tête du volet, l'imminence dans la capsule ═══════════════════ */
  group('P4 — échu, imminent, et l’ordre du volet');
  const _tm=(o)=>Object.assign({type:'interval',seconds:120,elapsedMs:0,running:false,lastStart:0,cycles:0},o);
  ok('échu · arrêté au bout de sa période', A.tmIsDue(_tm({elapsedMs:120000})));
  ok('non échu · il tourne encore', !A.tmIsDue(_tm({elapsedMs:120000,running:true})));
  ok('non échu · un chronomètre ne finit jamais', !A.tmIsDue(_tm({type:'stopwatch',elapsedMs:999999})));
  ok('non échu · période nulle', !A.tmIsDue(_tm({seconds:0,elapsedMs:5000})));
  /* Le seuil d'imminence est un nombre EXPLICITE : s'il bouge, il bouge en un seul endroit. */
  eq('le seuil d’imminence vaut 20 s', A.TM_SOON_MS, 20000);
  /* L'ordre : les échus non acquittés d'abord, l'ordre de l'AUTEUR conservé entre pairs. */
  {const a=_tm({id:'a'}),b=_tm({id:'b',elapsedMs:120000}),c=_tm({id:'c'}),d=_tm({id:'d',elapsedMs:120000});
   eq('échus en tête, ordre d’auteur conservé entre pairs',
      A.tmLiveOrder([a,b,c,d]).map(x=>x.id), ['b','d','a','c']);}
  /* P4b — L'ORDRE VIVANT : ce qui TOURNE se classe par temps RESTANT, pas par ordre d'auteur. */
  {const now=1000000;
   const t=(id,sec,el)=>_tm({id,seconds:sec,elapsedMs:el,running:true,lastStart:now});
   eq('ce qui tourne : le plus urgent d’abord',
      A.tmLiveOrder([t('lent',300,0),t('urgent',120,110000),t('moyen',180,60000)],now).map(x=>x.id),
      ['urgent','moyen','lent']);
   /* L'alarme passe DEVANT le plus urgent : un échu n'est plus une échéance, c'en est une passée. */
   eq('l’alarme passe devant tout ce qui tourne',
      A.tmLiveOrder([t('urgent',120,119000),_tm({id:'echu',elapsedMs:120000})],now).map(x=>x.id),
      ['echu','urgent']);
   /* En PAUSE ou chronomètre : à la fin, dans l'ordre de l'auteur — ils n'ont pas d'échéance. */
   eq('en pause et chronomètre à la fin, ordre d’auteur',
      A.tmLiveOrder([_tm({id:'pause'}),_tm({id:'chrono',type:'stopwatch',running:true}),t('court',60,30000)],now).map(x=>x.id),
      ['court','pause','chrono']);}
  /* ⚠ UN ÉCHU ACQUITTÉ NE REMONTE PLUS : il a cessé d'annoncer (A34), la carte reste échue. */
  {const a=_tm({id:'a'}),b=_tm({id:'b',elapsedMs:120000,ack:true});
   eq('un échu ACQUITTÉ ne remonte pas', A.tmLiveOrder([a,b]).map(x=>x.id), ['a','b']);}
  /* Le tri ne perd ni ne duplique personne. */
  {const l=[_tm({id:'a'}),_tm({id:'b',elapsedMs:120000}),_tm({id:'c'})];
   eq('aucun minuteur perdu ni dupliqué', A.tmLiveOrder(l).length, 3);}

  /* ══ Q4 (v5.7) — ce que la fiche embarque, en une ligne ════════════════════════════════
     Rien à dire → AUCUNE ligne : un panneau qui affirme « 0 minuteur » est du bruit. */
  group('Q4 — ce que la fiche embarque (carryLineHtml)');
  const _cf=(o)=>Object.assign({blocks:[{id:'b1'},{id:'b2'}],timers:[],counters:[],excursions:[]},o);
  eq('ni minuteur, ni compteur, ni complication → rien', A.carryLineHtml(_cf({})), '');
  ok('un minuteur → le compte des blocs ET du minuteur',
     /2 blocs · 1 minuteur/.test(A.carryLineHtml(_cf({timers:[{id:'t'}]}))));
  ok('pluriels accordés',
     /2 minuteurs · 2 compteurs/.test(A.carryLineHtml(_cf({timers:[{},{}],counters:[{},{}]}))));
  ok('une complication se dit « déclarée »',
     /1 complication déclarée/.test(A.carryLineHtml(_cf({excursions:[{}]}))));
  ok('aucune fiche → aucune ligne', A.carryLineHtml(null)==='');
  /* La ligne ne porte que du comptage : aucun texte d'auteur, donc rien à échapper — mais on
     vérifie qu'elle n'ouvre pas de balise inattendue (esc() reste la seule barrière). */
  ok('aucune balise autre que le conteneur',
     (A.carryLineHtml(_cf({timers:[{}]})).match(/</g)||[]).length===2);
  /* A130 (v5.8.0) — UNE PHRASE, DEUX LECTEURS. `carryParts` est le calcul ; l'écran d'entrée et
     la rangée de l'atelier d'import s'en servent tous les deux, donc les mots ne peuvent pas
     diverger. Ce qui diffère est le SEUIL, et chacun est motivé : avant le soin, une fiche sans
     minuteur ni compteur ni complication n'a rien à annoncer ; dans l'atelier, le compte des
     BLOCS est précisément ce qui distingue un algorithme complet d'une ébauche. */
  eq('la ligne d’entrée se tait, mais les parts existent (le seuil diffère, pas le calcul)',
     [A.carryLineHtml(_cf({})), A.carryParts(_cf({}))], ['', ['2 blocs']]);
  eq('mêmes mots que la ligne d’entrée', A.carryParts(_cf({timers:[{}],counters:[{},{}],excursions:[{}]})),
     ['2 blocs','1 minuteur','2 compteurs','1 complication déclarée']);
  eq('aucune fiche → aucune part', A.carryParts(null), []);
  eq('une fiche vide ne compte rien', A.carryParts({}), []);

  /* ══ LOT « PAGE » (v5.10.0) — LA GRILLE UNIQUE ═══════════════════════════════════════════════
     `svGridPlan` est PURE : elle lit la fiche et `flowPlan`, jamais le DOM ni l'état de session.
     Ce qu'on mesure ici est ce que le brief appelle la définition du fini — aucun bloc perdu ni
     dupliqué, les numéros restent ceux du plan, la sortie est déterministe, et la REPRISE DE
     LARGEUR : une branche profonde peut être PLUS LARGE que le tronc dont elle descend. */
  group('Lot Page — répartition des pistes (svDistribute)');
  eq('deux branches égales se partagent les six pistes', A.svDistribute(6,[2,2]), [3,3]);
  eq('trois branches égales : 2+2+2 (six est divisible par deux ET par trois)', A.svDistribute(6,[1,1,1]), [2,2,2]);
  /* LA REGLE QUI PRODUIT TOUT L'EFFET : au prorata de la HAUTEUR, reste à la plus haute — une
     branche longue à côté d'une sortie d'une ligne prend cinq pistes, donc plus que le tronc. */
  eq('branche longue contre sortie d’une ligne : 5 + 1', A.svDistribute(6,[7,1]), [5,1]);
  eq('minimum UNE piste par branche, même écrasée', A.svDistribute(2,[10,1]), [1,1]);
  eq('aucune branche → aucune piste', A.svDistribute(6,[]), []);
  ok('déterministe : deux appels, même sortie',
     JSON.stringify(A.svDistribute(6,[3,3,1]))===JSON.stringify(A.svDistribute(6,[3,3,1])));
  ok('la somme ne dépasse jamais l’étendue',
     [[6,[5,2,1]],[6,[1,1,1,1]],[4,[9,1]]].every(([sp,hs])=>A.svDistribute(sp,hs).reduce((a,b)=>a+b,0)===sp));

  group('Lot Page — le tracé en grille unique (svGridPlan)');
  const _pf=(blocks,start)=>A.migrate({id:'pg',title:'T',start:start||'b1',blocks});
  const _simple=_pf([{id:'b1',kind:'do',next:'d1'},
    {id:'d1',kind:'decision',question:'?',options:[{label:'oui',target:'b2'},{label:'non',target:'b3'}]},
    {id:'b2',kind:'do',next:'b4'},{id:'b3',kind:'do',next:'b4'},{id:'b4',kind:'do'}]);
  const G=A.svGridPlan(_simple);
  eq('six pistes, tronc sur quatre', [A.SV_TRACKS,A.SV_TRUNK], [6,4]);
  ok('déterministe et pure : deux appels donnent la même sortie',
     JSON.stringify(A.svGridPlan(_simple))===JSON.stringify(A.svGridPlan(_simple)));
  /* AUCUN BLOC PERDU NI DUPLIQUÉ — l'invariant que le brief demande d'écrire AVANT le lot :
     l'ensemble des blocs placés est exactement l'ordre de `flowPlan`. */
  eq('aucun bloc perdu ni dupliqué',
     G.nodes.filter(n=>n.k==='block'||n.k==='band').map(n=>n.id).sort(),
     A.flowPlan(_simple).order.slice().sort());
  ok('le tronc est centré : quatre pistes sur six, une libre de chaque côté',
     G.nodes.filter(n=>n.k==='block'&&n.id==='b1').every(n=>n.col===2&&n.span===4));
  ok('la fourche prend l’étendue ENTIÈRE du contexte',
     G.nodes.filter(n=>n.k==='fork').every(n=>n.col===1&&n.span===6));
  ok('un bras de fourche par branche, au CENTRE de chacune',
     G.nodes.filter(n=>n.k==='fork').every(n=>n.bras.length===2));
  ok('les options se posent sur les pistes de leur branche',
     G.nodes.filter(n=>n.k==='opt').map(n=>n.col+':'+n.span).join(' ')==='1:3 4:3');
  /* LA REPRISE DE LARGEUR — le tronc revient à sa position dès que les branches sont closes. */
  ok('branches closes → le tronc reprend sa place',
     G.nodes.some(n=>n.k==='block'&&n.id==='b4'&&n.col===2&&n.span===4));
  ok('une seule ligne par nœud, jamais deux nœuds au même endroit',
     new Set(G.nodes.map(n=>n.row+'/'+n.col)).size===G.nodes.length);
  /* UNE BRANCHE PROFONDE PLUS LARGE QUE SA PARENTE — la propriété qui a motivé tout le lot. */
  const _deep=_pf([{id:'b1',kind:'do',next:'d1'},
    {id:'d1',kind:'decision',options:[{label:'long',target:'b2'},{label:'court',target:'z'}]},
    {id:'b2',kind:'do',next:'b3'},{id:'b3',kind:'do',next:'b4'},{id:'b4',kind:'do',next:'b5'},
    {id:'b5',kind:'do',next:'b6'},{id:'b6',kind:'do',next:'b7'},{id:'b7',kind:'do',next:'z'},
    {id:'z',kind:'do'}]);
  const D=A.svGridPlan(_deep);
  ok('la branche longue prend CINQ pistes — plus que le tronc qui en a quatre',
     D.nodes.some(n=>n.k==='block'&&n.id==='b2'&&n.span===5));
  ok('la sortie d’une ligne garde sa piste',
     D.nodes.some(n=>n.k==='opt'&&n.span===1));
  /* FICHE SANS DÉCISION : le tronc seul, à quatre pistes sur six, sans grille dégénérée. */
  const _lin=_pf([{id:'b1',kind:'do',next:'b2'},{id:'b2',kind:'do'}]);
  const L=A.svGridPlan(_lin);
  ok('procédure linéaire : que du tronc, aucune fourche',
     L.nodes.every(n=>n.k!=='fork'&&n.k!=='opt')&&L.nodes.filter(n=>n.k==='block').every(n=>n.col===2&&n.span===4));
  eq('fiche vide → aucun nœud', A.svGridPlan(A.migrate({id:'v',title:'v',blocks:[]})).nodes, []);
  /* REPLI — plus de branches que de pistes : on EMPILE à pleine étendue plutôt que d'émietter.
     « En cas de doute, le repli est le rendu simple, jamais le rendu embrouillé. » */
  const _many=_pf([{id:'d1',kind:'decision',options:[1,2,3,4,5,6,7].map(i=>({label:'o'+i,target:'x'+i}))}]
    .concat([1,2,3,4,5,6,7].map(i=>({id:'x'+i,kind:'do'}))),'d1');
  const M=A.svGridPlan(_many);
  ok('sept branches sur six pistes → empilement à pleine étendue, jamais des pistes à zéro',
     M.nodes.filter(n=>n.k==='opt').every(n=>n.span===6)&&M.nodes.every(n=>n.span>=1));

  group('Lot Page — le cartouche');
  /* ⚠ L'AVERTISSEMENT DE VALIDATION est le seul point du lot qui touche à la sécurité : une
     feuille imprimée et affichée au mur sans « générée par IA — à relire et valider » est un
     danger. Le motif est celui que le prompt d'import IMPOSE. */
  const _sw=['Recos SFAR 2024 — SFAR, 2024','Fiche générée par IA le 03/08/2026 à partir de la source ci-dessus — à relire et valider avant usage.'];
  eq('l’avertissement de validation est reconnu', A.svValidWarn({sources:_sw}).length, 1);
  eq('…et il ne compte pas comme une source', A.svSources({sources:_sw}), ['Recos SFAR 2024 — SFAR, 2024']);
  eq('pas d’avertissement → rien à annoncer', A.svValidWarn({sources:['SFAR 2024']}), []);
  eq('aucune source → aucune des deux listes',
     [A.svValidWarn({}),A.svSources({})], [[],[]]);
  /* Le compte du cartouche est celui de `carryParts` — un seul calcul — plus les posologies, la
     seule chose que la question du DOCUMENT ajoute à celle de l'écran d'entrée. */
  ok('le compte dit les blocs puis les posologies',
     /^2 blocs · 1 posologie/.test(A.svCountsTxt(A.migrate({id:'c',title:'c',blocks:[{id:'a'},{id:'b'}],
       items:[{id:'i1',role:'dose',do:'ADRÉNALINE : 1 mg'}]}))));

  group('Lot Page — lire un repère (posoParts)');
  eq('nom et corps se coupent sur « : »', A.posoParts('ADRÉNALINE — IM : 0,5 mg'),
     {name:'ADRÉNALINE — IM',body:'0,5 mg',flag:false});
  eq('sans « : », tout est le corps', A.posoParts('à titre indicatif').name, '');
  ok('le registre de vigilance est lu', A.posoParts('△ DOSE : x').flag===true);

  /* ══ P7 (v5.7) — révisée depuis le dernier passage ═════════════════════════════════════ */
  group('P7 — la révision depuis votre dernier passage');
  const _fr={id:'f1',updatedAt:2000};
  eq('aucune session sur cette aide → rien', A.revisedSinceTxt(_fr,[]), '');
  /* Le passage a eu lieu sur la version COURANTE : rien à signaler. */
  eq('même révision → rien', A.revisedSinceTxt(_fr,[{ficheId:'f1',aidRev:2000,startedAt:1}]), '');
  /* Une session ANTÉRIEURE à la révision courante : on le dit. */
  ok('révision plus récente que le passage → la ligne existe',
     /révisée depuis votre dernier passage/.test(A.revisedSinceTxt(_fr,[{ficheId:'f1',aidRev:1000,startedAt:1}])));
  /* ⚠ C'est le DERNIER passage qui compte, pas le premier trouvé. */
  eq('un passage récent sur la version courante annule l’ancien',
     A.revisedSinceTxt(_fr,[{ficheId:'f1',aidRev:1000,startedAt:1},{ficheId:'f1',aidRev:2000,startedAt:9}]), '');
  /* Les sessions d'une AUTRE aide ne comptent pas. */
  eq('session d’une autre aide → ignorée',

  eq('session sans aidRev → ignorée',

  eq('aide sans updatedAt → rien', A.revisedSinceTxt({id:'f1'},[{ficheId:'f1',aidRev:1,startedAt:9}]), '');

  /* ══ P8 (v5.7) — l'écart entre deux gestes du MÊME objet, NU ═══════════════════════════
     Aucune moyenne, aucun seuil, aucune couleur : un fait, ou rien. */
  group('P8 — l’écart au compte rendu (evDeltas)');
  const _ev=(t,type,id,voidAt)=>({t,ref:type?{type,id}:null,voidAt:voidAt||0});
  eq('le premier d’une série n’a pas d’écart',
     A.evDeltas([_ev(1000,'counter','c1')]), [null]);
  eq('deux gestes du même compteur → l’écart',
     A.evDeltas([_ev(1000,'counter','c1'),_ev(4000,'counter','c1')]), [null,3000]);
  /* ⚠ PAR OBJET : « 3:56 » n'a de sens qu'entre deux doses du MÊME produit. */
  eq('deux compteurs différents n’ouvrent pas la même série',
     A.evDeltas([_ev(1000,'counter','c1'),_ev(2000,'counter','c2'),_ev(4000,'counter','c1')]),
     [null,null,3000]);
  /* Un repère libre (sans référence) n'ouvre aucune série. */
  eq('un repère sans référence → aucun écart',
     A.evDeltas([_ev(1000,null),_ev(2000,null)]), [null,null]);
  /* Un repère ANNULÉ reste dans la chronologie mais ne compte pas dans les écarts. */
  eq('un repère annulé ne compte pas, et ne coupe pas la série',
     A.evDeltas([_ev(1000,'counter','c1'),_ev(2000,'counter','c1',2500),_ev(4000,'counter','c1')]),
     [null,null,3000]);
  eq('aucun évènement → aucun écart', A.evDeltas([]), []);
  eq('robuste au néant', A.evDeltas(null), []);

  /* ══ Q1 (v5.7) — la relecture propose ce que le texte de l'auteur permettrait ═══════════
     Le nombre vient de SA phrase, jamais d'un barème. Rien n'est créé automatiquement. */
  group('Q1 — les propositions de relecture (reviewOffers)');
  const _q1=(steps,extra)=>A.migrate(Object.assign({id:'q1',v:4,kind:'procedure',title:'T',
    items:steps.map((t,i)=>({id:'q'+i,do:t})),
    blocks:[{id:'qb',title:'B',kind:'do',items:steps.map((_,i)=>'q'+i)}]},extra||{}));
  const _kinds=f=>A.reviewOffers(f).map(o=>o.kind);
  /* (1) le cycle écrit en toutes lettres */
  {const o=A.reviewOffers(_q1(['Analyse du rythme toutes les 2 min']));
   ok('« toutes les 2 min » → un minuteur', o.some(x=>x.kind==='interval'));
   eq('… avec la période LUE dans la phrase', (o.find(x=>x.kind==='interval')||{}).pre.seconds, 120);}
  ok('« à 5 min » → un minuteur de 300 s',
     (A.reviewOffers(_q1(['Renouveler à 5 min si besoin'])).find(x=>x.kind==='interval')||{pre:{}}).pre.seconds===300);
  ok('« q4h » → un minuteur de 4 heures',
     (A.reviewOffers(_q1(['Contrôle q4h'])).find(x=>x.kind==='interval')||{pre:{}}).pre.seconds===14400);
  /* ⚠ ON SE TAIT DÈS QUE LA CAPACITÉ EXISTE : la proposition n'a plus rien à apprendre. */
  ok('un minuteur à cycles existe déjà → aucune proposition de minuteur',
     _kinds(_q1(['Analyse toutes les 2 min'],{timers:[{id:'t1',label:'x',type:'interval',seconds:120}]})).indexOf('interval')<0);
  /* Un texte sans cadence ne déclenche rien : on ne propose pas au hasard. */
  ok('aucune cadence → aucun minuteur', _kinds(_q1(['Poser une voie veineuse'])).indexOf('interval')<0);
  /* (2) le geste qui se répète */
  ok('« renouveler » → un compteur', _kinds(_q1(['Renouveler la dose si besoin'])).indexOf('counter')>=0);
  ok('un compteur existe déjà → aucune proposition de compteur',
     _kinds(_q1(['Renouveler la dose'],{counters:[{id:'c1',label:'x'}]})).indexOf('counter')<0);
  /* ⚠ LE COMPTEUR NAÎT SANS NOM (A85, A99) : la proposition n'invente pas de mot. */
  eq('la proposition de compteur ne pré-remplit AUCUN nom',
     (A.reviewOffers(_q1(['Renouveler la dose'])).find(x=>x.kind==='counter')||{}).pre, null);
  /* (3) l'étape vitale qui n'est pas un memory item */
  {const o=A.reviewOffers(_q1(['⚠ Adrénaline IM 0,5 mg']));
   ok('une étape vitale sans ★ → la proposition existe', o.some(x=>x.kind==='memory'));
   ok('… et elle désigne l’item par son IDENTITÉ',
      /^q\d+$/.test(((o.find(x=>x.kind==='memory')||{pre:{}}).pre.itemId)||''));}
  ok('une étape ORDINAIRE ne déclenche pas ★', _kinds(_q1(['Poser une voie'])).indexOf('memory')<0);
  /* Le plafond du chapeau : on ne propose pas une file de ★. */
  /* ⚠ LE FIXTURE POSE ★ SUR L'ITEM, PAS SUR UN NIVEAU : `migrate` ne dérive pas `level` du
     préfixe « ⚠ » (c'est `stepIsCrit` qui lit la chaîne) — un fixture qui filtrerait sur
     `level===3` ne poserait rien et le témoin mesurerait le vide. */
  {const f=_q1(['⚠ Un geste vital','⚠ Un autre geste vital']);
   (f.items||[])[0].memory=true;
   ok('une ★ existe déjà → plus aucune proposition ★', _kinds(f).indexOf('memory')<0);}
  eq('aucune fiche → aucune proposition', A.reviewOffers(null), []);

  /* ══ F2 (v5.7, volet 3) — la bande de temps du moniteur ════════════════════════════════
     L'axe ne porte que ce qui a une ÉCHÉANCE DATÉE ; tout le reste va « sans heure ». */
  group('F2 — le plan de vol du moniteur (monBandData)');
  const _now=1000000;
  const _t2=(o)=>Object.assign({type:'interval',seconds:120,elapsedMs:0,running:false,lastStart:0,cycles:0},o);
  {const d=A.monBandData({a:_t2({id:'a',running:true,lastStart:_now,elapsedMs:60000})},[],_now);
   eq('un minuteur qui tourne est DATÉ', d.dated.length, 1);
   ok('… et placé après « maintenant »', d.dated[0].x>A.MON_NOW, String(d.dated[0].x));
   eq('… et rien ne va « sans heure »', d.sans.length, 0);}
  /* ⚠ UN MINUTEUR EN PAUSE N'A PAS D'HEURE — il a un reste. C'est toute la règle de la bande. */
  {const d=A.monBandData({a:_t2({id:'a',elapsedMs:60000})},[],_now);
   eq('en pause → aucun marqueur sur l’axe', d.dated.length, 0);
   eq('… mais une chip sans heure', d.sans.length, 1);
   eq('… qui dit le RESTE, pas une date', d.sans[0].val, '01:00');}
  /* Un échu est PASSÉ : il ne se place pas devant. */
  {const d=A.monBandData({a:_t2({id:'a',elapsedMs:120000})},[],_now);
   ok('échu → sans heure, et dit « échu »', d.dated.length===0&&d.sans.length===1&&d.sans[0].val==='échu');}
  /* Un chronomètre ne finit jamais : aucune échéance à dessiner. */
  {const d=A.monBandData({a:_t2({id:'a',type:'stopwatch',running:true})},[],_now);
   ok('chronomètre → jamais sur l’axe', d.dated.length===0&&d.sans.length===1);}
  /* Les tours suivants d'un CYCLIQUE sont projetés ; ceux d'un non-cyclique n'existent pas. */
  {const c=A.monBandData({a:_t2({id:'a',running:true,lastStart:_now,autoloop:true})},[],_now);
   ok('un cyclique projette ses tours suivants', c.ghosts.length>=1, String(c.ghosts.length));
   const nc=A.monBandData({a:_t2({id:'a',running:true,lastStart:_now})},[],_now);
   eq('un non-cyclique n’en projette aucun', nc.ghosts.length, 0);}
  /* Le passé : borné à trois, et deux points trop proches fusionnent. */
  {const ev=[{t:_now-100000},{t:_now-80000},{t:_now-60000},{t:_now-40000}];
   const d=A.monBandData({},ev,_now);
   ok('le passé est borné à trois repères', d.past.length<=3, String(d.past.length));
   const col=A.monBandData({},[{t:_now-60000},{t:_now-59000}],_now);
   ok('deux repères collés fusionnent et se comptent', col.past.length===1&&col.past[0].n===2);}
  /* Un repère hors fenêtre (plus de 2 min) ne se place pas. */
  {const d=A.monBandData({},[{t:_now-200000}],_now);
   eq('un repère trop ancien sort de la fenêtre', d.past.length, 0);}
  /* Un repère ANNULÉ n'est pas un fait : il ne se dessine pas. */
  {const d=A.monBandData({},[{t:_now-10000,voidAt:_now}],_now);
   eq('un repère annulé ne se dessine pas', d.past.length, 0);}
  eq('rien du tout → rien à dessiner',
     JSON.stringify(A.monBandData({},[],_now)), JSON.stringify({past:[],dated:[],ghosts:[],sans:[]}));

  /* ══ A131 — LEQUEL DES DEUX EST LE PLUS RÉCENT ? ═══════════════════════════════════════════
     Le prédicat que la rangée de l'atelier consulte pour dire ce que la question « Doublons »
     demande de trancher. Il ne DEVINE jamais : sans horodatage des deux côtés, il se tait. */
  group('A131 — la relation des deux versions (impDupRel)');
  eq('le fichier est postérieur → « le fichier est plus récent »', A.impDupRel(200, 100), 'neuf');
  eq('le fichier est antérieur → c’est MA version qui est plus récente', A.impDupRel(100, 200), 'vieux');
  /* Un objet exporté puis réimporté sans avoir été touché porte le MÊME horodatage : aucune
     tolérance n'est nécessaire, et « à une minute près » serait un seuil inventé. */
  eq('même horodatage à la milliseconde → même version', A.impDupRel(100, 100), 'egal');
  eq('une seconde d’écart n’est PAS « la même version »', A.impDupRel(101000, 100000), 'neuf');
  /* A83 — elle ne dit que ce qu'elle sait. Un fichier ancien peut n'en porter aucun ; c'est
     précisément le cas où `migrate` en poserait un, et où deviner serait mentir. */
  eq('aucun horodatage dans le fichier → la rangée se tait', A.impDupRel(null, 100), '');
  eq('aucun horodatage de mon côté → elle se tait aussi', A.impDupRel(100, undefined), '');
  eq('une valeur non numérique ne fait pas une révision', A.impDupRel('200', 100), '');
  eq('… ni une valeur infinie', A.impDupRel(Infinity, 100), '');
  eq('… ni NaN', A.impDupRel(NaN, 100), '');

  /* ══ A132 — CE QUE « REMPLACER » CHANGERAIT ════════════════════════════════════════════════
     Orientation : on part de MA version, l'entrant est la cible — « plus » est donc ce que le
     fichier APPORTE, « moins » ce qu'il emporterait. Aucun comparateur neuf : c'est celui de
     « Versions », seule l'orientation est nommée. */
  group('A132 — ce que remplacer changerait (impDiff)');
  {const mien={title:'Réf',status:'',body:'ligne A\nligne B',sources:[]};
   const entr={title:'Réf',status:'',body:'ligne A\nligne C',sources:[]};
   const d=A.impDiff(mien,entr,true);
   ok('ce que le fichier APPORTE est dans « plus »', d.plus.some(x=>/ligne C/.test(x)), JSON.stringify(d.plus));
   ok('ce qu’il EMPORTERAIT est dans « moins »', d.moins.some(x=>/ligne B/.test(x)), JSON.stringify(d.moins));
   ok('la ligne commune n’apparaît nulle part',
      !d.plus.concat(d.moins).some(x=>/ligne A/.test(x)), JSON.stringify(d));}
  {const p={title:'Réf',status:'',body:'x',sources:[]};
   const d=A.impDiff(p,p,true);
   eq('deux fois le même objet → aucune différence', d.plus.length+d.moins.length, 0);}
  /* Une RÉFÉRENCE n'a ni bloc ni minuteur : son corps est du texte, et ses lignes SONT ses unités
     de comparaison. Sans aplatissement propre, la moitié de la bibliothèque n'aurait pas eu de
     réponse à la même question destructive. */
  ok('le corps d’une référence entre ligne à ligne dans la comparaison',
     A.flattenProto({title:'R',body:'un\ndeux'}).filter(x=>/^Corps · /.test(x)).length===2,
     JSON.stringify(A.flattenProto({title:'R',body:'un\ndeux'})));
  eq('une ligne vide du corps n’est pas une unité de comparaison',
     A.flattenProto({title:'R',body:'un\n\n\ndeux'}).filter(x=>/^Corps · /.test(x)).length, 2);
  eq('rien du tout → rien à comparer', A.flattenProto(null).length, 0);
  /* Et le même comparateur sert les AIDES, par `flattenFiche` — celui de « Versions ». */
  {const mk=t=>A.migrate({id:'x',title:t,start:'b1',
     blocks:[{id:'b1',kind:'do',title:'Bloc',items:['Un geste']}]});
   const d=A.impDiff(mk('Ancien'),mk('Nouveau'),false);
   ok('sur une aide, le titre entrant est annoncé comme un ajout',
      d.plus.some(x=>/Nouveau/.test(x))&&d.moins.some(x=>/Ancien/.test(x)), JSON.stringify(d));}
}

// Ouvert en double-cliquant le fichier (file://) : le navigateur isole les iframes (origine
// « null ») et bloque l'accès aux fonctions à tester. Ce n'est pas un bug : il faut un serveur
// http, comme pour le service worker de l'app.
const FILE_HELP='Cette page doit être servie en http(s), pas ouverte comme fichier local : '+
  'le navigateur bloque alors l’accès à l’iframe de test (sécurité des origines). '+
  'Lancez un petit serveur dans ce dossier (ex. « python3 -m http.server 8123 ») puis ouvrez '+
  'http://localhost:8123/tests.html — ou utilisez l’URL de votre hébergement (…/tests.html).';
if(location.protocol==='file:'){
  const s=document.getElementById('summary');s.className='ko';s.textContent=FILE_HELP;
}
document.getElementById('app').addEventListener('load',async()=>{
  const s=document.getElementById('summary');
  if(location.protocol==='file:')return; // message déjà affiché ci-dessus
  try{
    const A=document.getElementById('app').contentWindow.__ac_test__;
    if(!A){s.className='ko';s.textContent='Échec : __ac_test__ introuvable (index.html non chargé en mode test ?).';return;}
    await run(A);
    s.className=fail?'ko':'ok';
    s.textContent=(fail?'✗ ':'✓ ')+pass+' réussis, '+fail+' échoués.';
  }catch(e){s.className='ko';s.textContent=(String(e.message).indexOf('cross-origin')>=0?FILE_HELP:'Erreur d’exécution des tests : '+e.message+' | '+String(e.stack||'').split(String.fromCharCode(10)).slice(0,4).join(' « ').slice(0,600));}
});
</script>
