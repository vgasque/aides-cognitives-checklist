<div id="sessionDock" class="" style="--sd-sx: 0.9378; --sd-sy: 0.7004;">
  <div class="sd-in">
    <!-- ⚠ LES DEUX PORTEUSES D'ICÔNE SONT VIDES, ET LE PEINTRE LES REMPLIT (A117e : la coque
         statique ne peut pas appeler `uiIcon`, on n'y recopie donc pas un tracé — un dessin
         recopié finit par diverger). C'est `syncDock` qui les peint, une fois. -->
    <button id="endKey" type="button" class="sd-key sd-end" aria-label="Terminer la session — confirmation demandée"><span class="dp-ic" aria-hidden="true"><svg class="tic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"></rect></svg></span><span class="dp-lbl">Fin</span></button>
    <button id="allBtn" class="sd-key" aria-label="Tout voir — l’aide entière, puis retour au bloc"><span class="dp-ic" aria-hidden="true"><svg class="tic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6M9 13h6M9 17h6"></path></svg></span><span class="dp-lbl">Tout voir</span></button>
    <button id="cxKey" type="button" class="sd-key sd-cx" aria-label="Complication : FV réfractaire (CEE inefficaces) — interrompt le parcours, retour prévu"><span class="dp-ic" aria-hidden="true"><svg class="tic bolt" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5z"></path></svg></span><span class="dp-lbl sd-name">FV réfractaire</span></button>
    <button id="tkKey" type="button" class="sd-key sd-tk" aria-label="Horodater — noter l’heure d’un geste, puis le nommer" aria-expanded="false"><span class="dp-ic" aria-hidden="true"><svg class="tic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg></span><span class="dp-lbl">Horodater</span></button>
    <!-- HORS SESSION, le dock n'a que deux commandes (maquette 1b/1c) : Exercice au CONTOUR,
         Démarrer REMPLI — la seule action qui compte avant le premier geste. Elles remplacent les
         quatre touches de session ; les deux jeux ne coexistent jamais. -->
    <button id="exoKey" type="button" class="sd-key sd-exo" aria-pressed="false" aria-label="Répéter en exercice — rien n’est enregistré comme soin" hidden=""><span class="dp-ic" aria-hidden="true">▲</span><span class="dp-lbl">Exercice</span><span class="dp-lbl dp-lbl-s" aria-hidden="true">Exo.</span></button>
    <button id="sessStart" type="button" class="sd-key sd-start" aria-label="Confirmé — démarrer la session — chrono, minuteurs et journal ; démarre aussi à la première action" hidden=""><span class="dp-lbl">Confirmé — démarrer la session</span><span class="sd-sub" id="sessStartSub" hidden="">Lance le chrono · minuteurs prêts</span></button>
  </div></div>
